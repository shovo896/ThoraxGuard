<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThoraxGuard | CT Scan Classifier</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">ThoraxGuard AI</p>
          <h1>Chest CT scan cancer screening assistant</h1>
          <p class="subtitle">
            Upload a CT scan image and the trained VGG16 classifier will predict
            whether it looks like adenocarcinoma or normal tissue.
          </p>
          <div class="status-pill" id="status-pill">Checking model...</div>
        </div>

        <section class="card">
          <form id="prediction-form" class="upload-form">
            <label class="drop-zone" for="file-input">
              <input id="file-input" name="file" type="file" accept="image/*" />
              <span class="drop-icon">+</span>
              <span class="drop-title">Choose CT image</span>
              <span class="drop-subtitle">PNG, JPG, or JPEG</span>
            </label>

            <img id="preview" class="preview hidden" alt="Selected CT preview" />

            <button id="predict-button" class="primary-button" type="submit">
              Predict scan
            </button>
          </form>

          <div id="result" class="result hidden">
            <p class="result-label">Prediction</p>
            <h2 id="prediction-text">-</h2>
            <p id="confidence-text" class="confidence">Confidence: -</p>

            <div class="probabilities">
              <div>
                <span>Adenocarcinoma</span>
                <strong id="adeno-score">0%</strong>
              </div>
              <div>
                <span>Normal</span>
                <strong id="normal-score">0%</strong>
              </div>
            </div>
          </div>

          <p id="message" class="message"></p>
        </section>
      </section>
    </main>

    <script>
      const form = document.getElementById("prediction-form");
      const fileInput = document.getElementById("file-input");
      const preview = document.getElementById("preview");
      const result = document.getElementById("result");
      const message = document.getElementById("message");
      const statusPill = document.getElementById("status-pill");
      const predictButton = document.getElementById("predict-button");

      const formatPercent = (value) => `${(value * 100).toFixed(2)}%`;

      fetch("/health")
        .then((response) => response.json())
        .then((data) => {
          statusPill.textContent = data.model_exists
            ? "Model ready"
            : "Model missing";
          statusPill.classList.toggle("warning", !data.model_exists);
        })
        .catch(() => {
          statusPill.textContent = "Health check failed";
          statusPill.classList.add("warning");
        });

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        result.classList.add("hidden");
        message.textContent = "";

        if (!file) {
          preview.classList.add("hidden");
          return;
        }

        preview.src = URL.createObjectURL(file);
        preview.classList.remove("hidden");
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];

        if (!file) {
          message.textContent = "Please choose a CT scan image first.";
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        predictButton.disabled = true;
        predictButton.textContent = "Predicting...";
        message.textContent = "";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Prediction failed.");
          }

          document.getElementById("prediction-text").textContent =
            data.prediction;
          document.getElementById("confidence-text").textContent =
            `Confidence: ${formatPercent(data.confidence)}`;
          document.getElementById("adeno-score").textContent = formatPercent(
            data.probabilities.adenocarcinoma
          );
          document.getElementById("normal-score").textContent = formatPercent(
            data.probabilities.normal
          );
          result.classList.remove("hidden");
        } catch (error) {
          result.classList.add("hidden");
          message.textContent = error.message;
        } finally {
          predictButton.disabled = false;
          predictButton.textContent = "Predict scan";
        }
      });
    </script>
  </body>
</html>
